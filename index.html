<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Misi Gagak Lodra 48</title>
<style>
:root{--bg:#e6eee4;--fg:#12302c;--muted:#4d6b66;--btn:#0f2a2e;--btnfg:#e8d9b0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081417;--fg:#e8d9b0;--muted:#8fb0aa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#081417;--fg:#e8d9b0;--muted:#8fb0aa;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:12px}
#wrap{width:100%;max-width:800px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#000;border-radius:6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
p{margin:8px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
#pad{display:none!important}
[hidden]{display:none!important}
/* --- overlay putar perangkat (layar sentuh portrait) --- */
#rot{position:fixed;inset:0;z-index:60;background:rgba(4,14,16,.97);color:#e8d9b0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px}
#rot .ph{font-size:74px;line-height:1.2;animation:glrot 1.8s ease-in-out infinite}
#rot h2{margin:0;color:#ffd23f;font-size:22px}
#rot p{margin:0;color:#cfe3e0;font-size:14px;max-width:340px;line-height:1.55}
@keyframes glrot{0%,25%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
/* --- form data siswa --- */
#form{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(4,14,16,.8);padding:12px}
.fbox{position:relative;width:min(430px,94vw);max-height:94vh;overflow:auto;background:rgba(10,34,30,.97);border:3px solid #c9a44c;border-radius:14px;padding:16px 20px;color:#e8d9b0;box-shadow:0 12px 34px rgba(0,0,0,.55)}
.fx{position:absolute;top:10px;right:10px;width:34px;height:34px;border:2px solid #c0392b;border-radius:9px;background:rgba(40,14,10,.92);color:#ffb0a0;font-size:16px;font-weight:bold;cursor:pointer;font-family:inherit;line-height:1;padding:0}
.fx:hover{background:#5a1a12}
.fbox h2{margin:0;color:#ffd23f;font-size:21px;letter-spacing:.5px}
.fbox .sub{margin:2px 0 6px;color:#9fb8b5;font-size:11.5px}
.fbox label{display:block;margin:8px 0 3px;color:#cfe3e0;font-size:12.5px;font-weight:bold}
.fbox input{width:100%;padding:11px 12px;border-radius:9px;border:2px solid #5a6a58;background:rgba(6,20,18,.92);color:#fff;font-size:16px;font-family:inherit}
.fbox input:focus{outline:none;border-color:#ffd23f}
/* --- refleksi siswa (bagian laporan akhir) --- */
#refl{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;background:rgba(4,14,16,.85);padding:12px}
#refl .fbox{width:min(470px,94vw)}
#refl textarea{width:100%;padding:11px 12px;border-radius:9px;border:2px solid #5a6a58;background:rgba(6,20,18,.92);color:#fff;font-size:15px;font-family:inherit;resize:vertical;min-height:112px;line-height:1.5}
#refl textarea:focus{outline:none;border-color:#ffd23f}
#rGo{flex:1;padding:12px;border:2px solid #ffd23f;border-radius:9px;background:#1c5a34;color:#ffd23f;font-weight:bold;font-size:14px;cursor:pointer;font-family:inherit}
#rSkip{padding:12px 14px;border:2px solid #7a6a3a;border-radius:9px;background:transparent;color:#cfe3e0;font-size:13px;cursor:pointer;font-family:inherit}
#rErr{color:#ff8a7a;font-size:12px;min-height:16px;margin-top:8px;font-weight:bold}
.frow{display:flex;gap:10px;margin-top:14px}
#fGo{flex:1;padding:12px;border:2px solid #ffd23f;border-radius:9px;background:#1c5a34;color:#ffd23f;font-weight:bold;font-size:15px;cursor:pointer;font-family:inherit}
#fBack{padding:12px 14px;border:2px solid #7a6a3a;border-radius:9px;background:transparent;color:#cfe3e0;font-size:13px;cursor:pointer;font-family:inherit}
#fErr{color:#ff8a7a;font-size:12px;min-height:16px;margin-top:8px;font-weight:bold}
/* --- mode landscape di layar sentuh: kanvas memenuhi layar --- */
@media (pointer:coarse) and (orientation:landscape){
  body{padding:0}
  #wrap{max-width:none;height:100vh;height:100dvh;display:flex;flex-direction:column;justify-content:center}
  canvas{width:auto;height:auto;max-width:100vw;max-height:100vh;max-height:100dvh;margin:0 auto;border-radius:0}
  p{display:none}
}
/* --- layar penuh: rasio 16:9 SELALU dipertahankan (letterbox hitam), tidak melar/ditarik.
     Ukuran = sebesar mungkin tanpa mengubah proporsi: w=min(layar_w, layar_h*16/9), h=min(layar_h, layar_w*9/16) --- */
html:fullscreen{background:#000}
html:fullscreen body{padding:0;background:#000}
html:fullscreen #wrap{max-width:none;width:100vw;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;background:#000}
html:fullscreen canvas{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);border-radius:0}
@supports (width:100dvh){html:fullscreen canvas{width:min(100vw,177.7778dvh);height:min(100dvh,56.25vw)}}
html:fullscreen p{display:none}
html:-webkit-full-screen{background:#000}
html:-webkit-full-screen body{padding:0;background:#000}
html:-webkit-full-screen #wrap{max-width:none;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:#000}
html:-webkit-full-screen canvas{width:min(100vw,177.7778vh);height:min(100vh,56.25vw);border-radius:0}
html:-webkit-full-screen p{display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<div id="pad">
<div><button data-k="ArrowLeft">&#9664;</button><button data-k="ArrowRight">&#9654;</button></div>
<div><button data-k="KeyP" class="mini">&#10074;&#10074;</button><button data-k="Space">&#9650;</button><button data-k="KeyZ">&#9679;</button></div>
</div>
<div id="rot"><div class="ph">&#128241;</div><h2>Putar Perangkatmu</h2><p>Misi Gagak Lodra 48 dimainkan dalam mode landscape (layar mendatar). Putar HP-mu, ya!</p></div>
<div id="form" hidden><form id="fsiswa" autocomplete="on"><div id="fbox" class="fbox">
<button type="button" id="fX" class="fx" aria-label="Kembali ke menu">&#10005;</button>
<h2>&#128203; DATA SISWA</h2>
<div class="sub">Lengkapi data sebelum memulai misi</div>
<label for="fNama">Nama Lengkap</label><input id="fNama" name="nama" maxlength="32" placeholder="Nama lengkapmu" autocomplete="name">
<label for="fKelas">Kelas</label><input id="fKelas" name="kelas" maxlength="12" placeholder="contoh: V-A" autocomplete="off">
<label for="fAbsen">Nomor Absen</label><input id="fAbsen" name="absen" type="text" inputmode="numeric" maxlength="3" placeholder="contoh: 12" autocomplete="off">
<div class="frow"><button type="button" id="fBack">&#9666; KEMBALI</button><button type="submit" id="fGo">MULAI MISI &#9656;</button></div>
<div id="fErr"></div>
</div></form></div>
<div id="refl" hidden><form id="frefl"><div class="fbox">
<button type="button" id="rX" class="fx" aria-label="Kembali ke layar kemenangan">&#10005;</button>
<h2>&#128221; REFLEKSI SISWA</h2>
<div class="sub">Bagian dari Laporan Akhir Misi &mdash; refleksimu dikirim ke Kapten (Guru) lewat WhatsApp</div>
<label for="rText">Refleksimu</label><textarea id="rText" maxlength="500" placeholder="Contoh: Aku menjadi lebih memahami perjuangan Kompi Gagak Lodra dalam mempertahankan kemerdekaan..."></textarea>
<div class="frow"><button type="button" id="rSkip">&#9666; LEWATI</button><button type="submit" id="rGo">KIRIM LAPORAN AKHIR &#9656;</button></div>
<div id="rErr"></div>
</div></form></div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=800,H=450,GROUND=380,F1="'Trebuchet MS',Verdana,sans-serif",F2="'Arial Black',Impact,'Trebuchet MS',sans-serif";
/* Resolusi gambar (backing store): PC 2x = 1600x900 agar tajam saat layar penuh; sentuh 1.5x agar ringan.
   Koordinat logika tetap 800x450; draw() mengalikan lewat g.setTransform(RES,...) tiap frame. */
const RES=(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)?1.5:2;
cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);
const keys={};
addEventListener('keydown',e=>{
  if(e.code==='Escape'&&state==='siswa'){showForm(false);state='menu';return}
  if(e.code==='Escape'&&state==='refleksi'){showRefl(false);state='win';return}
  if(e.code==='Escape'&&(document.fullscreenElement||document.webkitFullscreenElement))return;
  const tn=e.target&&e.target.tagName;
  if(tn==='INPUT'||tn==='TEXTAREA'||tn==='SELECT'||tn==='BUTTON'){if(MUS.on)musicStart();return}
  keys[e.code]=true;
  if(MUS.on&&e.code!=='KeyM'&&e.code!=='KeyN')musicStart();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(state==='quiz'&&['KeyA','KeyB','KeyC','KeyD'].includes(e.code)){const map={'KeyA':'A','KeyB':'B','KeyC':'C','KeyD':'D'};submitQuiz(map[e.code]);return;}
  if(state==='bank'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')&&!e.repeat){e.code==='ArrowLeft'?bankStep(-1):bankStep(1);return}
  if(state==='arsip'&&(e.code==='ArrowLeft'||e.code==='ArrowRight')&&!e.repeat){archLv=(archLv+(e.code==='ArrowRight'?1:2))%3;archSel=-1;archOff=0;archListOff=0;return}
  if(state==='select'&&!e.repeat){if(e.code==='ArrowLeft'||e.code==='ArrowRight'){selLv=(selLv+(e.code==='ArrowRight'?1:2))%3;sfx('talk');return}if(/^Digit[1-3]$/.test(e.code)){mulaiLevel(+e.code.slice(5)-1);return}}
  if(state==='menu'&&!e.repeat){
    if(e.code==='ArrowUp'||e.code==='KeyW'){menuSel=(menuSel+4)%5;sfx('talk');return}
    if(e.code==='ArrowDown'||e.code==='KeyS'){menuSel=(menuSel+1)%5;sfx('talk');return}
    if(e.code==='KeyM'){menuSel=0;openLevels();return}
    if(e.code==='Enter'){menuGo();return}
    if(e.code==='KeyP'||e.code==='KeyH'){menuSel=1;state='help';return}
    if(e.code==='KeyB'){menuSel=2;state='bank';bankLv=0;bankQ=0;return}
    if(e.code==='KeyA'){menuSel=3;state='arsip';return}
    if(e.code==='KeyX'||e.code==='Escape'){menuSel=4;state='quit';return}
    if(e.code==='KeyN'){toggleMusic();return}
  }
  if((state==='help'||state==='bank'||state==='arsip'||state==='quit'||state==='select')&&e.code==='Escape'&&!e.repeat){goMenu();return}
  if(e.code==='KeyF'&&!e.repeat){goFS();return}
  if(e.code==='Enter'&&!e.repeat)act();
  if((e.code==='KeyP'||e.code==='Escape')&&!e.repeat){if(state==='quiz')return;pause()}
  if((e.code==='KeyM'||e.code==='KeyN')&&!e.repeat)toggleMusic();
});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)delete keys[k];for(const id in ptrs)delete ptrs[id]});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='KeyP'){pause();return}keys[k]=true});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>keys[k]=false))});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  if(state==='play'){
    const zk=zoneAt(x,y);if(zk){e.preventDefault();ptrs[e.pointerId]=zk;keys[zk]=true;return}
    if(x>696&&x<=740&&y<60){toggleMusic();return}if(x>740&&y<60)pause();return}
  if(state==='quiz'){handleQuizPointer(x,y);return}
  if(state==='bank'){
    if(x>=718&&x<=764&&y>=26&&y<=72){goMenu();return}
    for(let i=0;i<3;i++){const tx=104+i*200;if(x>=tx&&x<=tx+180&&y>=88&&y<=112){bankLv=i;bankQ=0;return}}
    if(x>=58&&x<=108&&y>=384&&y<=416){bankStep(-1);return}
    if(x>=694&&x<=744&&y>=384&&y<=416){bankStep(1);return}
    if(x>=250&&x<=550&&y>=384&&y<=416){dlBank();return}
    if(x>=56&&x<=744&&y>=118&&y<=380){bankStep(1);return}
    state='menu';return
  }
  if(state==='arsip'){
    if(x>=718&&x<=764&&y>=26&&y<=72){goMenu();return}
    for(let i=0;i<3;i++){const tx=104+i*200;if(x>=tx&&x<=tx+180&&y>=88&&y<=112){archLv=i;archSel=-1;archOff=0;archListOff=0;return}}
    if(x>=250&&x<=550&&y>=384&&y<=416){dlArch();return}
    if(archSel>=0){archDrag={id:e.pointerId,y0:y,off0:archOff,moved:false};return}
    const A2=ARCH[archLv]||[];
    for(let k=0;k<A2.length;k++){const cy=118+k*100-archListOff;if(x>=56&&x<=736&&y>=cy&&y<=cy+88&&y>=110&&y<=380){archDrag={id:e.pointerId,y0:y,off0:archListOff,moved:false,row:k};return}}
    if(x>=56&&x<=744&&y>=118&&y<=378){archDrag={id:e.pointerId,y0:y,off0:archListOff,moved:false,list:1};return}
    state='menu';return
  }
  if(state==='quit'){
    if(x>=584&&x<=628&&y>=112&&y<=156){goMenu();quitHint=false;return}
    if(x>=240&&x<=560&&y>=252&&y<=292){state='menu';quitHint=false;return}
    if(x>=240&&x<=560&&y>=296&&y<=336){quitHint=true;try{window.close()}catch(err){}return}
    if(x>=240&&x<=560&&y>=340&&y<=380){wipeAll();return}
    return
  }
  if(state==='menu'){
    if(x>=748&&x<=792&&y>=8&&y<=52){goFS();return}
    if(x>=700&&x<=744&&y>=8&&y<=52){toggleMusic();return}
    const hitBtn=(by,h)=>x>=300&&x<=500&&y>=by&&y<=by+h;
    if(hitBtn(224,34)){menuSel=0;if(TOUCH&&!(document.fullscreenElement||document.webkitFullscreenElement))goFS();menuGo();return}
    if(hitBtn(268,34)){menuSel=1;menuGo();return}
    if(hitBtn(312,34)){menuSel=2;menuGo();return}
    if(hitBtn(356,34)){menuSel=3;menuGo();return}
    if(hitBtn(400,34)){menuSel=4;menuGo();return}
    return
  }
  if(state==='select'){
    if(x>=718&&x<=764&&y>=26&&y<=72){goMenu();return}
    if(x>=310&&x<=490&&y>=382&&y<=414){goMenu();return}
    for(let i=0;i<3;i++){const cx=28+i*250;if(x>=cx&&x<=cx+230&&y>=96&&y<=316){selLv=i;
      if(i+1>unlocked){sfx('hurt');toast={h:'Level masih digembok',s:'Selesaikan Level '+i+' untuk membuka Level '+(i+1)+'.',t:220};return}
      mulaiLevel(i);return}}
    if(x>=250&&x<=550&&y>=330&&y<=372){mulaiLevel(selLv);return}
    return
  }
  if(state==='win'){if(x>=430&&x<=595&&y>=336&&y<=388){goMenu();return}openRefl();return}
  if(state==='clear'){if(x>=120&&x<=310&&y>=336&&y<=388){load(lv+1);return}if(x>=325&&x<=540&&y>=336&&y<=388){sendLevelReportWA(lv);return}if(x>=552&&x<=682&&y>=336&&y<=388){goMenu();return}act();return}
  if(state==='pause'){if(x>696&&x<=740&&y<60){toggleMusic();return}if(x>740&&y<60){state='play';return}const hp=b=>x>=280&&x<=520&&y>=b&&y<=b+46;if(hp(168)){state='play';return}if(hp(226)){restartLevel();return}if(hp(284)){goMenu();return}if(hp(342)){goFS();return}return}
  if(state==='over'||state==='help'){act();return}
  act();
});
let mxy=null;
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;mxy={x,y};
  if(state==='arsip'&&archDrag&&e.pointerId===archDrag.id){const dy=y-archDrag.y0;if(Math.abs(dy)>6)archDrag.moved=true;if(archDrag.moved){if(archDrag.row!=null||archDrag.list)archListOff=archDrag.off0-dy*1.35;else archOff=archDrag.off0-dy*1.35}}});
const left=()=>keys.ArrowLeft||keys.KeyA,right=()=>keys.ArrowRight||keys.KeyD,jump=()=>keys.Space||keys.ArrowUp||keys.KeyW||keys.KeyK,shoot=()=>keys.KeyZ||keys.KeyJ;

/* ---------- DATA SISWA, PILIH LEVEL (gembok progresif) & MODE MOBILE (landscape) ---------- */
let TOUCH=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
let SISWA={nama:'',kelas:'',absen:''};
try{Object.assign(SISWA,JSON.parse(localStorage.getItem('gl48_siswa'))||{})}catch(e){}
const CHARS=[
 {n:'BAGAS',d:['Pemimpin regu','Tenang & berani'],pal:{body:'#cdb98a',body2:'#b9a473',pants:'#83744e',hat:'#6b6740',hat2:'#53502f',rim:'#8f8a58',skin:'#f0c08a',pack:'#6b5a2f',boot:'#4a3220',hatT:'cap',feather:1,arm:1,scarf:'#d62828'}},
 {n:'ARIF',d:['Penjelajah arsip','Gesit & lincah'],pal:{body:'#c2ad7c',body2:'#ad9765',pants:'#7a6c48',hat:'#63603c',hat2:'#4c4a2c',rim:'#877f50',skin:'#e6b88a',pack:'#7a4a28',boot:'#3a2814',hatT:'cap',feather:1,arm:1,scarf:'#ff8a1f'}},
 {n:'SARI',d:['Perawat lapangan','Sigap & peduli'],pal:{body:'#d6c294',body2:'#c4b081',pants:'#877854',hat:'#716c44',hat2:'#595534',rim:'#968f5c',skin:'#f6d0a8',pack:'#b03a2e',boot:'#4a3220',hatT:'cap',hair:'#2a1c12',pony:1,band:1,arm:1,scarf:'#f2f0e6',cross:1}},
 {n:'MAYA',d:['Ahli strategi medan','Tenang & cermat'],pal:{body:'#c9b88a',body2:'#b6a578',pants:'#6f6a4c',hat:'#5c5a3c',hat2:'#47452d',rim:'#847e54',skin:'#f0c08a',pack:'#3f5d78',boot:'#2a2014',hatT:'cap',hair:'#171a1e',buns:1,arm:1,scarf:'#ff6b8a'}}
];
let charSel=0;try{charSel=Math.min(3,Math.max(0,parseInt(localStorage.getItem('gl48_char'))||0))}catch(e){}
function saveChar(){try{localStorage.setItem('gl48_char',String(charSel))}catch(e){}}
const PINFO=()=>'Pemain: '+(SISWA.nama||'Petualang')+' \u2022 Kelas '+(SISWA.kelas||'-')+' \u2022 No. Absen '+(SISWA.absen||'-');
function goFS(){const d=document;try{if(d.fullscreenElement||d.webkitFullscreenElement){const ex=d.exitFullscreen||d.webkitExitFullscreen;if(ex)ex.call(d);return}}catch(e){}const el=d.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;if(rq){try{const p=rq.call(el);if(p&&p.catch)p.catch(()=>{})}catch(e){}}try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
/* Umpan balik masuk/keluar layar penuh (juga saat keluar lewat tombol Esc peramban) */
function fsToast(on){toast=on?{a:1,h:'Layar penuh aktif',s:'Rasio gambar dipertahankan. Klik ikon layar penuh sekali lagi atau tekan F untuk kembali ke ukuran awal.',t:220}:{a:1,h:'Kembali ke ukuran awal',s:'Tekan F atau klik ikon layar penuh di menu untuk memperbesar lagi.',t:180}}
document.addEventListener('fullscreenchange',()=>fsToast(!!document.fullscreenElement));
document.addEventListener('webkitfullscreenchange',()=>fsToast(!!(document.fullscreenElement||document.webkitFullscreenElement)));
const TZ=[{k:'ArrowLeft',x:64,y:392,r:36,ic:'\u25C0'},{k:'ArrowRight',x:148,y:392,r:36,ic:'\u25B6'},{k:'KeyZ',x:624,y:402,r:30,ic:'\u25CF'},{k:'Space',x:718,y:390,r:40,ic:'\u25B2'}];
const zoneAt=(x,y)=>{for(const z of TZ){const dx=x-z.x,dy=y-z.y,r=z.r||34;if(dx*dx+dy*dy<r*r)return z.k}return null};
const ptrs={};
cv.addEventListener('pointermove',e=>{if(!(e.pointerId in ptrs))return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const z=(state==='play')?zoneAt(x,y):null,old=ptrs[e.pointerId];if(z!==old){if(old)keys[old]=false;if(z)keys[z]=true;ptrs[e.pointerId]=z}e.preventDefault()},{passive:false});
function relPtr(e){const old=ptrs[e.pointerId];if(old){keys[old]=false;delete ptrs[e.pointerId]}}
addEventListener('pointerup',relPtr);addEventListener('pointercancel',relPtr);
addEventListener('pointerup',e=>{if(state==='arsip'&&archDrag){if(!archDrag.moved){if(archDrag.row!=null){if(archGot[archLv+'-'+archDrag.row]){archSel=archDrag.row;archOff=0;sfx('talk')}}else if(archSel>=0){archSel=-1;archOff=0}}archDrag=null}});

const fEl=document.getElementById('form'),fNama=document.getElementById('fNama'),fKelas=document.getElementById('fKelas'),fAbsen=document.getElementById('fAbsen'),fErr=document.getElementById('fErr');
function showForm(on){fEl.hidden=!on;if(on){fErr.textContent='';fNama.value=SISWA.nama||'';fKelas.value=SISWA.kelas||'';fAbsen.value=SISWA.absen||'';if(!TOUCH)setTimeout(()=>fNama.focus(),80)}else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function openSiswa(){state='siswa';showForm(true);toast=null}
function submitSiswa(){const nm=fNama.value.trim(),kl=fKelas.value.trim(),ab=fAbsen.value.trim();if(!nm||!kl||!ab){fErr.textContent='Lengkapi semua data terlebih dahulu ya!';return}SISWA={nama:nm,kelas:kl,absen:ab};try{localStorage.setItem('gl48_siswa',JSON.stringify(SISWA))}catch(e){}showForm(false);musicStart();startLevel(pendLv)}
/* ---------- PILIH LEVEL dengan gembok progresif ----------
   Identitas diisi sekali saja (saat pertama memulai misi); level berikutnya
   terbuka setelah level sebelumnya diselesaikan. Karakter tunggal: BAGAS. */
let unlocked=1;try{unlocked=Math.min(3,Math.max(1,parseInt(localStorage.getItem('gl48_unlock'))||1))}catch(e){}
let cleared=0;try{cleared=Math.min(3,Math.max(0,parseInt(localStorage.getItem('gl48_clear'))||0))}catch(e){}
let selLv=0,pendLv=0;
function saveUnlock(){try{localStorage.setItem('gl48_unlock',String(unlocked))}catch(e){}}
function saveCleared(){try{localStorage.setItem('gl48_clear',String(cleared))}catch(e){}}
function openLevels(){state='select';selLv=Math.min(selLv,unlocked-1);toast=null}
function mulaiLevel(i){
  if(i+1>unlocked){sfx('hurt');toast={h:'Level masih digembok',s:'Selesaikan Level '+i+' untuk membuka Level '+(i+1)+'.',t:220};return}
  if(!SISWA.nama||!SISWA.kelas||!SISWA.absen){pendLv=i;openSiswa();return}
  startLevel(i)
}
function startLevel(i){musicStart();score=0;coins=0;lives=3;askedQ={};lvRes={};currentQuiz=null;quizQueue=[];load(i);toast=null}
document.getElementById('fsiswa').addEventListener('submit',e=>{e.preventDefault();submitSiswa()});
document.getElementById('fBack').addEventListener('click',()=>{showForm(false);state='menu'});
document.getElementById('fX').addEventListener('click',()=>{showForm(false);state='menu'});

/* ---------- refleksi siswa & laporan akhir (WA) ---------- */
let REFLEKSI='';try{REFLEKSI=localStorage.getItem('gl48_refl')||''}catch(e){}
const rEl=document.getElementById('refl'),rText=document.getElementById('rText'),rErr=document.getElementById('rErr');
function showRefl(on){rEl.hidden=!on;if(on){rErr.textContent='';rText.value=REFLEKSI||'';if(!TOUCH)setTimeout(()=>rText.focus(),80)}else if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
function openRefl(){state='refleksi';toast=null;showRefl(true)}
function submitRefl(send){
  if(send&&!rText.value.trim()){rErr.textContent='Tulis refleksimu dulu, atau tekan LEWATI untuk mengirim laporan tanpa refleksi.';return}
  if(send){REFLEKSI=rText.value.trim();try{localStorage.setItem('gl48_refl',REFLEKSI)}catch(e){}}
  showRefl(false);state='win';sendReportWA();
}
document.getElementById('frefl').addEventListener('submit',e=>{e.preventDefault();submitRefl(true)});
document.getElementById('rSkip').addEventListener('click',()=>submitRefl(false));
document.getElementById('rX').addEventListener('click',()=>{showRefl(false);state='win'});

const QUIZ_BANK=[
 {no:1,level:1,type:'LOTS',question:'Salah satu tujuan kebijakan Reorganisasi dan Rasionalisasi (RE-RA) dalam Angkatan Perang Republik Indonesia adalah ....',options:['Menambah jumlah divisi yang berdiri secara terpisah','Menyederhanakan struktur organisasi Tentara Nasional Indonesia','Menghentikan seluruh kegiatan militer Republik','Menyerahkan komando militer kepada Belanda'],answer:'B',points:10,exp:'RE-RA bertujuan menyederhanakan struktur organisasi TNI, meningkatkan profesionalisme prajurit, dan menyesuaikan kekuatan militer dengan kemampuan ekonomi negara (Moedjanto, 1993).'},
 {no:2,level:1,type:'LOTS',question:'Brigade IV (Brigade IV Brawijaya) secara resmi dibentuk pada ....',options:['25 Mei 1948 di Sumber Tangkep, Dampit','22 November 1948 di Sumber Tangkep, Dampit','25 Mei 1948 di Wajak','19 Desember 1948 di Turen'],answer:'A',points:10,exp:'Brigade IV resmi dibentuk 25 Mei 1948 di Sumber Tangkep, Dampit (Semdam VIII/Brawijaya, 1968). Keputusan 22 November 1948 hanya menetapkan susunan pimpinan.'},
 {no:3,level:1,type:'LOTS',question:'Kompi II \u201CGagak Lodra\u201D dipimpin oleh ....',options:['Mayor Hamid Rusdi','Letnan Kolonel A. Rifai','Kapten Sabar Sutopo','Kolonel Soengkono'],answer:'C',points:10,exp:'Kompi II \u201CGagak Lodra\u201D dipimpin Kapten Sabar Sutopo (Sutopo, 1981). Mayor Hamid Rusdi memimpin Batalyon I, Letkol A. Rifai memimpin awal Brigade IV, dan Kolonel Soengkono memimpin Divisi I Jawa Timur.'},
 {no:4,level:1,type:'MOTS',question:'Pada masa awal kemerdekaan, Angkatan Perang Republik Indonesia berkembang dalam situasi yang tidak teratur. Jika kondisi tersebut dikaitkan dengan kebijakan RE-RA, langkah yang paling sesuai ditempuh pemerintah adalah ....',options:['Membiarkan setiap kesatuan berdiri sendiri-sendiri','Memperbesar kekuatan militer tanpa memperhitungkan kemampuan ekonomi negara','Menyerahkan penataan angkatan perang kepada pihak Belanda','Menata kembali organisasi agar lebih sederhana dengan sistem komando yang lebih terkoordinasi'],answer:'D',points:15,exp:'RE-RA dilatarbelakangi kondisi Angkatan Perang yang tidak teratur, sehingga organisasi ditata ulang agar lebih sederhana dan komandonya lebih terkoordinasi (Moedjanto, 1993).'},
 {no:5,level:1,type:'MOTS',question:'Sebelum reorganisasi, kekuatan militer di Jawa Timur terdiri atas Divisi Suropati, Divisi Narotama, dan Divisi Ronggolawe. Penerapan kebijakan RE-RA di wilayah tersebut ditunjukkan oleh ....',options:['Pembubaran ketiga divisi tanpa ada satuan pengganti','Pemisahan Divisi Suropati menjadi beberapa divisi baru','Peleburan ketiga divisi menjadi Divisi I Jawa Timur di bawah Kolonel Soengkono, serta penyusunan resimen menjadi brigade','Penyerahan ketiga divisi kepada Letnan Kolonel dr. Soedjono'],answer:'C',points:15,exp:'Ketiga divisi dilebur menjadi Divisi I Jawa Timur di bawah Kolonel Soengkono; resimen yang berdiri sendiri disusun kembali menjadi brigade (Sapto, 2012).'},
 {no:6,level:1,type:'MOTS',question:'Seorang siswa menyusun bagan satuan Batalyon I dan Kompi II \u201CGagak Lodra\u201D. Pasangan pimpinan dan satuan yang sesuai dengan materi adalah ....',options:['Batalyon I dipimpin Mayor Hamid Rusdi; Kompi II dipimpin Kapten Sabar Sutopo dengan tiga seksi, yaitu Seksi Soeseno, Seksi Soetomo, dan Seksi Sarim','Batalyon I dipimpin Kapten Sabar Sutopo; Kompi II dipimpin Mayor Hamid Rusdi dengan tiga seksi','Batalyon I dipimpin Letnan Kolonel dr. Soedjono; Kompi II dipimpin Mayor Rusman dengan tiga seksi','Batalyon I dipimpin Mayor Hamid Rusdi; Kompi II dipimpin Kolonel Soengkono dengan dua seksi'],answer:'A',points:15,exp:'Batalyon I dipimpin Mayor Hamid Rusdi. Kompi II \u201CGagak Lodra\u201D di bawah Kapten Sabar Sutopo terdiri atas tiga seksi: Soeseno, Soetomo, dan Sarim (Sutopo, 1981).'},
 {no:7,level:1,type:'HOTS',question:'Seorang siswa berpendapat bahwa RE-RA melemahkan perjuangan karena banyak organisasi militer dilebur. Berdasarkan materi, tanggapan yang paling tepat adalah ....',options:['Pendapat itu benar, karena peleburan organisasi membuat Republik kehilangan kemampuan menghadapi Belanda','Pendapat itu kurang tepat, karena RE-RA justru menyederhanakan struktur, meningkatkan profesionalisme prajurit, menyesuaikan kekuatan dengan kemampuan ekonomi negara, dan membentuk sistem komando yang lebih terkoordinasi untuk menghadapi kemungkinan agresi Belanda','Pendapat itu benar, karena RE-RA bertujuan memperbanyak organisasi militer','Pendapat itu kurang tepat, karena RE-RA hanya mengatur pembagian wilayah administrasi sipil'],answer:'B',points:20,exp:'RE-RA bukan pelemahan, melainkan penataan: struktur disederhanakan, profesionalisme meningkat, kekuatan disesuaikan dengan ekonomi negara, dan komando lebih terkoordinasi (Moedjanto, 1993).'},
 {no:8,level:1,type:'HOTS',question:'Batalyon I bertugas mengamankan sebagian Keresidenan Malang yang berada di sekitar garis demarkasi hasil Perjanjian Renville, serta dipersiapkan sebagai kekuatan utama operasi gerilya apabila Belanda kembali menyerang. Kesimpulan yang paling tepat tentang peran batalyon tersebut adalah ....',options:['Wilayah sekitar garis demarkasi sengaja dikosongkan dari pasukan Republik','Batalyon I hanya bertugas pada urusan administrasi karena operasi gerilya diserahkan kepada satuan lain','Batalyon I tidak berperan dalam mempertahankan Republik di Malang bagian timur dan selatan','Batalyon I mengemban dua fungsi sekaligus, yaitu pertahanan wilayah di posisi yang strategis dan kesiapan sebagai kekuatan utama gerilya'],answer:'D',points:20,exp:'Batalyon I mengamankan wilayah strategis dekat garis demarkasi Renville sekaligus disiapkan sebagai kekuatan utama gerilya, sehingga berperan mempertahankan eksistensi Republik di Malang timur dan selatan (Nasution, 1978; Wicaksono, 2012).'},
 {no:9,level:1,type:'HOTS',question:'Perhatikan dua pernyataan berikut. (1) Kompi II dikenal dengan sebutan \u201CGagak Lodra\u201D karena memiliki mobilitas tinggi dan mampu beradaptasi dengan cepat pada kondisi geografis Malang Selatan. (2) Kompi tersebut dipercaya melaksanakan berbagai operasi militer di wilayah yang sulit dijangkau pasukan Belanda. Hubungan yang paling tepat antara kedua pernyataan adalah ....',options:['Keduanya tidak berhubungan karena sebutan \u201CGagak Lodra\u201D hanya bersifat simbolis','Pernyataan (2) terjadi karena Kompi II memiliki jumlah pasukan terbesar di Batalyon I','Karakter pada pernyataan (1) menjadi dasar kepercayaan pada pernyataan (2), sebab medan pegunungan, hutan, dan lembah menuntut kemampuan bergerak dan menyesuaikan diri','Pernyataan (1) menunjukkan bahwa Kompi II tidak memerlukan dukungan kondisi medan'],answer:'C',points:20,exp:'Mobilitas tinggi dan kemampuan beradaptasi pada medan pegunungan, hutan, dan lembah Malang Selatan menjadi dasar kepercayaan menjalankan operasi di wilayah yang sulit dijangkau Belanda (Hadi & Sutopo, 1997).'},
 {no:10,level:2,type:'LOTS',question:'Agresi Militer Belanda II dilancarkan pada tanggal ....',options:['25 Mei 1948','22 November 1948','27 Desember 1949','19 Desember 1948'],answer:'D',points:10,exp:'Belanda melancarkan Agresi Militer Belanda II pada 19 Desember 1948 (Ricklefs, 2008). Tanggal 27 Desember 1949 adalah penyerahan kedaulatan penuh secara nasional.'},
 {no:11,level:2,type:'LOTS',question:'Operasi militer Belanda pada Agresi Militer Belanda II dikenal dengan nama ....',options:['Wingate Action','Operatie Kraai (Operasi Gagak)','Reorganisasi dan Rasionalisasi','Blitzkrieg'],answer:'B',points:10,exp:'Operasi militer Belanda bernama Operatie Kraai (Operasi Gagak) (Ricklefs, 2008). Wingate Action adalah strategi TNI, bukan operasi Belanda.'},
 {no:12,level:2,type:'LOTS',question:'Wingate Action adalah ....',options:['Operasi penyusupan pasukan ke wilayah yang telah berada di bawah pendudukan Belanda','Penataan kembali organisasi Angkatan Perang agar sesuai dengan kemampuan ekonomi negara','Pertahanan wilayah secara terbuka dan permanen di kota-kota besar','Perundingan antara Republik Indonesia dan Belanda'],answer:'A',points:10,exp:'Wingate Action adalah operasi penyusupan pasukan ke wilayah yang telah berada di bawah pendudukan Belanda (Nasution, 1984).'},
 {no:13,level:2,type:'MOTS',question:'Belanda menduduki Yogyakarta serta menangkap Presiden Soekarno dan Wakil Presiden Mohammad Hatta, lalu berupaya menunjukkan bahwa peristiwa itu merupakan akhir Republik Indonesia. Bukti yang paling menunjukkan bahwa upaya tersebut tidak sepenuhnya berhasil adalah ....',options:['Pemerintahan Republik tetap berpusat di Yogyakarta','Seluruh pasukan Republik menyerahkan diri kepada Belanda','Perlawanan bersenjata tetap berlangsung di berbagai daerah melalui operasi gerilya TNI','TNI mempertahankan kota-kota besar melalui pertahanan terbuka'],answer:'C',points:15,exp:'Perlawanan bersenjata tetap berlangsung di berbagai daerah melalui operasi gerilya TNI (Pusat Sejarah dan Tradisi TNI, 2000).'},
 {no:14,level:2,type:'MOTS',question:'Kompi Gagak Lodra memperoleh tugas melaksanakan Wingate Action di wilayah Malang Tenggara, yaitu Wajak, Tumpang, dan Poncokusumo. Tugas yang sesuai dengan operasi tersebut adalah ....',options:['Mempertahankan Wajak, Tumpang, dan Poncokusumo secara permanen melalui pertahanan terbuka','Mengonsolidasikan kembali kekuatan gerilya, membangun hubungan dengan masyarakat, mengganggu jalur logistik musuh, dan membuka jalur infiltrasi bagi Batalyon Sjamsul Islam dan Batalyon Abdul Sjarif','Menarik seluruh pasukan keluar dari wilayah pendudukan Belanda','Membatasi hubungan dengan masyarakat agar operasi tidak diketahui warga'],answer:'B',points:15,exp:'Tugas kompi: mengonsolidasikan kekuatan gerilya, membangun hubungan dengan rakyat, mengganggu logistik musuh, dan membuka jalur infiltrasi bagi Batalyon Sjamsul Islam dan Abdul Sjarif (Sutopo, 1981; Hadi & Sutopo, 1997).'},
 {no:15,level:2,type:'MOTS',question:'Sebuah satuan akan bergerak di daerah yang dipatroli Belanda dengan menerapkan prinsip gerilya sebagaimana dilakukan Kompi Gagak Lodra. Tindakan yang paling sesuai adalah ....',options:['Bergerak dalam satu barisan besar melalui jalan utama','Berkumpul di satu lokasi terbuka agar mudah dikoordinasikan','Memenuhi seluruh kebutuhan logistik dari persediaan sendiri tanpa bantuan masyarakat','Bergerak dalam kelompok-kelompok kecil melalui jalur hutan, perkebunan, lembah, dan jalan setapak untuk menghindari pengawasan patroli Belanda'],answer:'D',points:15,exp:'Prinsip gerilya: bergerak dalam kelompok kecil memanfaatkan jalur hutan, perkebunan, lembah, dan jalan setapak agar terhindar dari pengawasan patroli Belanda (Nasution, 1984).'},
 {no:16,level:2,type:'HOTS',question:'Pusat pemerintahan Republik telah diduduki Belanda, sementara pasukan Republik menghadapi keterbatasan persenjataan dan logistik. Penilaian yang paling tepat terhadap peralihan TNI dari peperangan konvensional ke perang gerilya adalah ....',options:['Tepat, karena gerilya memanfaatkan kondisi geografis untuk melemahkan lawan, mengurangi risiko kehancuran pasukan, dan memungkinkan perlawanan tetap berlangsung walaupun pusat pemerintahan diduduki','Kurang tepat, karena pertahanan wilayah secara terbuka lebih efektif untuk mengatasi keterbatasan persenjataan','Kurang tepat, karena gerilya baru dapat dilakukan setelah pusat pemerintahan dikuasai kembali','Tepat, karena gerilya membuat TNI tidak lagi memerlukan dukungan logistik'],answer:'A',points:20,exp:'Gerilya mengurangi risiko kehancuran pasukan dan menjaga eksistensi Republik di tengah keterbatasan persenjataan serta ketika pusat pemerintahan diduduki (Simatupang, 1980; Nasution, 1984).'},
 {no:17,level:2,type:'HOTS',question:'Sebuah satuan yang menjalankan Wingate Action terpaksa meninggalkan daerah yang baru dimasukinya karena tekanan pasukan Belanda. Dilihat dari tujuan utama Wingate Action, penilaian yang paling tepat adalah ....',options:['Operasi gagal total karena wilayah tidak dapat dipertahankan secara permanen','Operasi hanya dianggap berhasil jika wilayah dikuasai selamanya','Operasi belum tentu gagal, karena tujuannya bukan mempertahankan wilayah secara permanen, melainkan membangun kembali jaringan pertahanan rakyat, menjaga keberadaan Republik secara de facto, serta mengganggu pertahanan dan logistik Belanda dari dalam','Operasi harus dihentikan karena Belanda telah mengetahui jalur masuk pasukan'],answer:'C',points:20,exp:'Tujuan Wingate Action bukan mempertahankan wilayah permanen, melainkan membangun jaringan pertahanan rakyat, menjaga Republik secara de facto, dan mengganggu logistik Belanda dari dalam (Nasution, 1979).'},
 {no:18,level:2,type:'HOTS',question:'Keberhasilan Wingate Action sangat bergantung pada kemampuan pasukan bergerak secara mandiri, menjaga kerahasiaan operasi, dan mendapat dukungan masyarakat setempat. Jika sebuah satuan gagal menjaga kerahasiaan dan tidak memperoleh dukungan masyarakat, akibat yang paling mungkin terjadi adalah ....',options:['Operasi tetap berhasil karena Belanda tidak memiliki keunggulan persenjataan','Keberhasilan operasi terancam, sebab kerahasiaan dan dukungan masyarakat (makanan, tempat persembunyian, dan informasi) menopang berlangsungnya operasi','Satuan otomatis memperoleh logistik dari pasukan Belanda','Operasi berubah menjadi pertahanan terbuka yang lebih menguntungkan'],answer:'B',points:20,exp:'Kerahasiaan dan dukungan masyarakat (makanan, tempat persembunyian, informasi) menopang operasi, sementara Belanda unggul dalam persenjataan dan jumlah pasukan (Nasution, 1979; Wicaksono, 2012).'},
 {no:19,level:3,type:'LOTS',question:'Pada awal Agresi Militer Belanda II, Kompi Gagak Lodra memasuki Kecamatan Wajak dan menguasai dua desa sebagai basis pertahanan awal, yaitu ....',options:['Jajang dan Pandansari','Tosari dan Begawan','Garotan dan Bambangan','Taji dan Gubugklakah'],answer:'C',points:10,exp:'Di Kecamatan Wajak, pasukan menguasai Desa Garotan dan Desa Bambangan sebagai basis pertahanan awal (Sutopo, 1981).'},
 {no:20,level:3,type:'LOTS',question:'Dalam perjalanan menuju Pandansari pada 20 Desember 1948, pasukan garda depan yang berhadapan langsung dengan patroli Belanda dari Pos Poncokusumo dipimpin oleh ....',options:['Seksi Soeseno','Seksi Soetomo','Letnan Sumodihardjo','Seksi Sarim'],answer:'D',points:10,exp:'Garda depan dipimpin Seksi Sarim berhadapan langsung dengan patroli Belanda dari Pos Poncokusumo; Seksi Soeseno ditempatkan di Desa Garotan (Sutopo, 1981).'},
 {no:21,level:3,type:'LOTS',question:'Persediaan beras milik Belanda yang ditemukan Kompi Gagak Lodra di gudang desa Gubugklakah pada pagi hari 21 Desember 1948 kemudian ....',options:['Dibagikan kepada masyarakat sekitar','Dikirim ke Yogyakarta','Dibakar agar tidak dimanfaatkan siapa pun','Diserahkan kembali kepada patroli Belanda'],answer:'A',points:10,exp:'Beras dibagikan kepada masyarakat sekitar sebagai bantuan logistik sekaligus memperkuat hubungan pasukan dengan penduduk (Sutopo, 1981).'},
 {no:22,level:3,type:'LOTS',question:'Untuk wilayah Malang Tenggara, pusat pelaksanaan alih kekuasaan taktis dari tentara Belanda (KL/KNIL) kepada APRIS dilaksanakan di ....',options:['Wajak','Turen','Dampit','Pandansari'],answer:'B',points:10,exp:'Turen dipilih karena posisinya strategis sebagai kota kecamatan dan pusat ekonomi perkebunan (Wahyu & Wicaksono, 2017).'},
 {no:23,level:3,type:'MOTS',question:'Menghadapi serangan Belanda yang menerapkan strategi blitzkrieg dengan kekuatan lebih besar, Kapten Sabar Sutopo menarik seluruh pasukan dari Wajak menuju Hutan Wonosari di Poncokusumo. Penerapan prinsip gerilya yang paling tepat dari keputusan tersebut adalah ....',options:['Menyelamatkan kekuatan utama agar operasi dapat dilanjutkan di wilayah lain yang lebih menguntungkan','Menyerahkan Wajak sebagai tanda berakhirnya perjuangan','Mengubah strategi menjadi pertahanan terbuka permanen di Poncokusumo','Menghentikan seluruh operasi gerilya sampai Belanda menarik diri'],answer:'A',points:15,exp:'Menarik pasukan bukan kemunduran, melainkan strategi gerilya untuk menyelamatkan kekuatan utama agar operasi berlanjut di wilayah yang lebih menguntungkan (Hadi & Sutopo, 1997).'},
 {no:24,level:3,type:'MOTS',question:'Di tengah keterbatasan logistik, masyarakat Dusun Begawan menyambut para gerilyawan dengan memberikan singkong, ubi, dan bantuan logistik lainnya yang dipusatkan di kediaman Bapak Dasiyah. Peristiwa tersebut menunjukkan bahwa ....',options:['Perjuangan mempertahankan kemerdekaan hanya dilakukan oleh tentara','Pasukan gerilya tidak lagi membutuhkan dukungan logistik','Dukungan masyarakat merupakan faktor penting yang memungkinkan operasi gerilya tetap berlangsung, dan perjuangan melibatkan partisipasi aktif warga sipil','Masyarakat Begawan menggantikan seluruh tugas militer pasukan'],answer:'C',points:15,exp:'Dukungan masyarakat memungkinkan operasi gerilya tetap berlangsung di tengah tekanan Belanda dan membuktikan perjuangan melibatkan partisipasi warga sipil (Tarso, 2017).'},
 {no:25,level:3,type:'MOTS',question:'Kompi Gagak Lodra mengalami kesulitan melakukan perlawanan secara efektif dalam Pertempuran Lembah Kali Jahe. Faktor yang sesuai dengan keterangan materi adalah ....',options:['Pasukan kehabisan seluruh senjata sebelum Belanda tiba','Belanda menyerang dari dalam lembah, sedangkan pasukan Republik menguasai perbukitan','Pasukan Republik tidak mengetahui bahwa jalur menuju Jabung telah dikuasai Belanda','Belanda menduduki perbukitan Pusung Manggis yang mengelilingi lembah setelah mendapat informasi dari mata-mata di Desa Taji, menyerang dari posisi lebih tinggi saat hujan dan kabut, sementara komunikasi antarseksi terputus'],answer:'D',points:15,exp:'Mata-mata di Desa Taji membuat Belanda menduduki Pusung Manggis lalu menyerang dari ketinggian saat hujan dan kabut; medan licin dan komunikasi antarseksi terputus (Artawi, 2017; Hadi & Sutopo, 1997).'},
 {no:26,level:3,type:'MOTS',question:'Pada pertengahan tahun 1949, Kompi Gagak Lodra yang telah disusun kembali di Desa Garotan melancarkan taktik tabrak lari (hit-and-run) di poros Wajak\u2013Turen. Tujuan penerapan taktik tersebut adalah ....',options:['Memusatkan seluruh pasukan di satu lokasi untuk bertahan secara terbuka','Mempersempit ruang gerak patroli Belanda di poros Wajak\u2013Turen','Menghentikan pasokan logistik dari jaringan bawah tanah masyarakat','Mempercepat penyerahan wilayah di Turen tanpa kegiatan militer apa pun'],answer:'B',points:15,exp:'Taktik tabrak lari dilancarkan untuk mempersempit ruang gerak patroli Belanda di poros Wajak\u2013Turen (Hadi & Sutopo, 1997).'},
 {no:27,level:3,type:'HOTS',question:'Pada 22 Desember 1948 pukul 05.00 WIB, pasukan yang sedang beristirahat di gudang beras diserang dua kompi Belanda yang didukung kendaraan lapis baja dan pesawat udara. Kemudian di Hutan Kali Jahe, Belanda mengetahui keberadaan pasukan yang beristirahat di bawah pohon besar melalui informasi mata-mata. Kesimpulan yang paling tepat dari kedua peristiwa tersebut adalah ....',options:['Keberhasilan menghancurkan pos musuh menjamin keselamatan pasukan pada operasi berikutnya','Keberadaan mata-mata Belanda tidak memengaruhi jalannya operasi gerilya','Strategi gerilya tetap menghadapi risiko besar apabila posisi persembunyian atau tempat istirahat pasukan diketahui Belanda, sehingga kerahasiaan lokasi sangat penting','Pasukan gerilya lebih aman beristirahat di tempat terbuka agar mudah mengamati musuh'],answer:'C',points:20,exp:'Gerilya tetap berisiko besar bila posisi persembunyian diketahui musuh, sehingga kerahasiaan lokasi sangat penting (Sutopo, 1981; Hadi & Sutopo, 1997; Nasution, 1979).'},
 {no:28,level:3,type:'HOTS',question:'Secara taktis, Pertempuran Lembah Kali Jahe mengakibatkan kerugian besar, yaitu sekitar 37 hingga 40 prajurit gugur. Namun secara strategis, pertempuran itu mengalihkan perhatian Belanda sehingga penyusupan Batalyon Abdul Sjarif dan Batalyon Sjamsul Islam menuju Pasuruan dan Probolinggo berlangsung lebih aman. Penilaian yang paling tepat adalah ....',options:['Kerugian taktis dapat terjadi bersamaan dengan dampak strategis yang lebih luas, sehingga pertempuran perlu dinilai dari kedua sisi','Pertempuran gagal total karena banyak prajurit yang gugur','Pertempuran tidak berpengaruh terhadap operasi batalyon lain','Pertempuran berhasil sepenuhnya karena tidak ada kerugian di pihak Republik'],answer:'A',points:20,exp:'Kerugian taktis dan dampak strategis berlangsung bersamaan: pengorbanan di Kali Jahe menyelamatkan penyusupan batalyon lain ke Pasuruan dan Probolinggo (Hadi & Sutopo, 1997).'},
 {no:29,level:3,type:'HOTS',question:'Meskipun mengalami kerugian besar di Lembah Kali Jahe, Kompi Gagak Lodra mampu melancarkan taktik tabrak lari pada pertengahan tahun 1949. Faktor yang paling tepat menjelaskan pemulihan tersebut adalah ....',options:['Belanda menghentikan seluruh patroli di Malang Tenggara','Seluruh prajurit yang gugur di Kali Jahe kembali bergabung','Penyerahan kedaulatan penuh secara nasional telah terjadi','Konsolidasi di Garotan dengan datangnya pasukan tambahan bersenjata berat di bawah Letnan Sumodihardjo, pulihnya semangat tempur, serta menguatnya pasokan logistik rahasia dari jaringan bawah tanah masyarakat Malang Tenggara'],answer:'D',points:20,exp:'Konsolidasi Garotan: pasukan tambahan Letnan Sumodihardjo (Mortier 8 dan 12,7), semangat tempur pulih, dan logistik rahasia jaringan bawah tanah menguat (Sutopo, 1981; Hadi & Sutopo, 1997).'},
 {no:30,level:3,type:'HOTS',question:'Pasca Konferensi Meja Bundar (KMB) akhir tahun 1949, Kapten Sabar Sutopo memimpin delegasi Kompi Gagak Lodra menerima dokumen pemetaan wilayah, kunci fasilitas vital, dan pos-pos penjagaan dari komandan pos militer Belanda di Turen. Makna historis peristiwa tersebut yang paling tepat adalah ....',options:['Menandai dimulainya kembali konfrontasi bersenjata di Malang Tenggara','Menandai berakhirnya era konfrontasi bersenjata di Malang Tenggara sekaligus mengukuhkan keberhasilan gerilya Kompi Gagak Lodra mempertahankan kedaulatan hingga penyerahan kedaulatan penuh secara nasional pada 27 Desember 1949','Menunjukkan bahwa Agresi Militer Belanda II belum pernah terjadi','Menandai dibubarkannya Kompi Gagak Lodra tanpa kelanjutan satuan'],answer:'B',points:20,exp:'Penyerahan Turen mengakhiri konfrontasi bersenjata di Malang Tenggara hingga kedaulatan penuh 27 Desember 1949; Kompi II menjadi Kompi Bantuan Batalyon Infanteri 512 (Aprilzal, 2023; Sutopo, 1981).'}
];

const ARCH=[/* Level 1 — Panggilan Perjuangan (Arsip 01-03) */
[
  {h:"Kebijakan Reorganisasi dan Rasionalisasi (RE-RA)",d:"RE-RA menata kembali organisasi Angkatan Perang Republik Indonesia yang berkembang tidak teratur pada masa awal kemerdekaan.",b:["Reorganisasi dan Rasionalisasi (RE-RA) merupakan salah satu kebijakan penting pemerintah Republik Indonesia dalam menata kembali organisasi Angkatan Perang pada masa Revolusi Kemerdekaan. Kebijakan ini dilatarbelakangi oleh kondisi Angkatan Perang Republik Indonesia pada masa awal kemerdekaan yang berkembang dalam situasi tidak teratur.", "Kebijakan ini bertujuan menyederhanakan struktur organisasi Tentara Nasional Indonesia, meningkatkan profesionalisme prajurit, serta menyesuaikan kekuatan militer dengan kemampuan ekonomi negara yang pada saat itu masih sangat terbatas.", "Selain sebagai langkah efisiensi organisasi, RE-RA juga diarahkan untuk membentuk sistem komando yang lebih terkoordinasi sehingga mampu menghadapi kemungkinan terjadinya kembali agresi militer Belanda."],n:"Kesimpulan: RE-RA adalah penataan organisasi Angkatan Perang untuk menyederhanakan struktur, meningkatkan profesionalisme prajurit, menyesuaikan kekuatan dengan kemampuan ekonomi negara, dan membentuk sistem komando yang lebih terkoordinasi. Sumber: Moedjanto (1993) \u2022 Terkait soal: 1, 4, 7."},
  {h:"Divisi I Jawa Timur dan Pembentukan Brigade IV",d:"Pelaksanaan RE-RA melebur tiga divisi di Jawa Timur menjadi Divisi I Jawa Timur dan melahirkan Brigade IV Brawijaya.",b:["Pelaksanaan RE-RA membawa perubahan besar pada struktur militer di Jawa Timur. Sebelumnya, kekuatan militer di wilayah ini terdiri atas Divisi Suropati, Divisi Narotama, dan Divisi Ronggolawe yang berdiri secara terpisah. Ketiganya dilebur menjadi satu kesatuan baru bernama Divisi I Jawa Timur yang dipimpin oleh Kolonel Soengkono. Berbagai resimen yang sebelumnya berdiri sendiri juga disusun kembali menjadi beberapa brigade sebagai bagian dari penyederhanaan struktur komando.", "Salah satu hasil penting reorganisasi tersebut adalah Brigade IV, yang kemudian lebih dikenal sebagai Brigade IV Brawijaya. Brigade ini secara resmi dibentuk pada 25 Mei 1948 di Sumber Tangkep, Dampit, sebagai hasil penggabungan Resimen 38 dan Resimen 39 Divisi VII Untung Suropati dengan sejumlah kesatuan kelaskaran yang sebelumnya bergerak secara mandiri.", "Pada awal pembentukannya, Brigade IV dipimpin oleh Letnan Kolonel A. Rifai sebelum diserahterimakan kepada Letnan Kolonel dr. Soedjono, dengan Mayor Rusman sebagai Kepala Staf berdasarkan Keputusan Gubernur Militer Divisi I Jawa Timur tanggal 22 November 1948. Pembentukan Brigade IV menjadi bagian dari strategi pemerintah untuk membangun organisasi militer yang lebih terintegrasi sehingga koordinasi operasi di wilayah Jawa Timur dapat dilaksanakan secara lebih efektif."],n:"Kesimpulan: Brigade IV lahir dari penataan ulang kesatuan-kesatuan di Jawa Timur menjadi organisasi militer yang lebih terintegrasi. Sumber: Sapto (2012); Semdam VIII/Brawijaya (1968) \u2022 Terkait soal: 2, 5."},
  {h:"Batalyon I dan Kompi II \u201cGagak Lodra\u201d",d:"Batalyon I di bawah Mayor Hamid Rusdi mengamankan wilayah strategis; Kompi II \u201cGagak Lodra\u201d pimpinan Kapten Sabar Sutopo menjadi satuan tempurnya.",b:["Dalam struktur organisasi Brigade IV terdapat beberapa batalyon yang memiliki wilayah operasi masing-masing. Salah satunya adalah Batalyon I yang dipimpin oleh Mayor Hamid Rusdi. Batalyon ini bertugas mengamankan sebagian wilayah Keresidenan Malang yang strategis karena berada di sekitar garis demarkasi hasil Perjanjian Renville. Selain menjalankan fungsi pertahanan wilayah, Batalyon I juga dipersiapkan sebagai kekuatan utama dalam melaksanakan operasi gerilya apabila Belanda kembali melancarkan serangan terhadap wilayah Republik. Oleh karena itu, batalyon ini memiliki peran penting dalam mempertahankan eksistensi Republik Indonesia di kawasan Malang bagian timur dan selatan.", "Kompi II \u201cGagak Lodra\u201d merupakan salah satu satuan tempur di bawah komando Batalyon I. Kompi ini dipimpin oleh Kapten Sabar Sutopo dan terdiri atas tiga seksi operasional, yaitu Seksi Soeseno, Seksi Soetomo, dan Seksi Sarim.", "Sebutan \u201cGagak Lodra\u201d diberikan karena karakter pasukan yang dikenal memiliki mobilitas tinggi serta mampu beradaptasi dengan cepat pada kondisi geografis Malang Selatan yang didominasi kawasan pegunungan, hutan, dan lembah. Kemampuan tersebut menjadikan Kompi Gagak Lodra sebagai salah satu satuan yang dipercaya untuk melaksanakan berbagai operasi militer di wilayah yang sulit dijangkau oleh pasukan Belanda."],n:"Kesimpulan: Kompi II \u201cGagak Lodra\u201d dipimpin Kapten Sabar Sutopo, berada di bawah Batalyon I Mayor Hamid Rusdi, dan dipercaya beroperasi di wilayah sulit karena mobilitas dan kemampuan adaptasinya. Sumber: Nasution (1978); Wicaksono (2012); Sutopo (1981); Hadi & Sutopo (1997) \u2022 Terkait soal: 3, 6, 8, 9."}
],
/* Level 2 — Menembus Jalur Wingate (Arsip 04-07) */
[
  {h:"Agresi Militer Belanda II (Operatie Kraai)",d:"Pada 19 Desember 1948 Belanda melancarkan Agresi Militer II melalui Operatie Kraai; Yogyakarta diduduki, tetapi perlawanan gerilya berlanjut.",b:["Kondisi pertahanan Republik Indonesia yang sempat mereda setelah Perjanjian Renville kembali memburuk ketika Belanda melancarkan Agresi Militer Belanda II pada tanggal 19 Desember 1948 melalui operasi militer yang dikenal dengan nama Operatie Kraai (Operasi Gagak).", "Serangan tersebut diawali dengan pendudukan Yogyakarta sebagai ibu kota Republik Indonesia, disusul penangkapan Presiden Soekarno, Wakil Presiden Mohammad Hatta, serta sejumlah tokoh pemerintahan lainnya. Secara politik, Belanda berupaya menunjukkan bahwa peristiwa ini merupakan akhir Republik Indonesia. Namun, perlawanan bersenjata tetap berlangsung di berbagai daerah melalui operasi-operasi gerilya yang dilakukan oleh Tentara Nasional Indonesia."],n:"Kesimpulan: Agresi Militer Belanda II (19 Desember 1948) menduduki Yogyakarta dan menangkap tokoh pemerintahan, tetapi perlawanan bersenjata tetap berlangsung melalui gerilya TNI. Sumber: Ricklefs (2008); Poesponegoro & Notosusanto (2019); Pusat Sejarah dan Tradisi TNI (2000) \u2022 Terkait soal: 10, 11, 13."},
  {h:"Peralihan dari Peperangan Konvensional ke Perang Gerilya",d:"TNI meninggalkan pertahanan terbuka dan beralih ke perang gerilya untuk mengurangi risiko kehancuran di tengah keterbatasan persenjataan.",b:["Menghadapi kondisi tersebut, Tentara Nasional Indonesia meninggalkan strategi peperangan konvensional yang bertumpu pada pertahanan wilayah secara terbuka. TNI kemudian beralih menerapkan strategi perang gerilya yang memanfaatkan kondisi geografis untuk melemahkan lawan.", "Simatupang (1980) menilai strategi ini lebih efektif karena mampu mengurangi risiko kehancuran pasukan sekaligus mempertahankan eksistensi Republik Indonesia di tengah keterbatasan persenjataan dan logistik. Selain itu, perang gerilya memungkinkan pasukan Republik tetap memberikan perlawanan meskipun pusat pemerintahan telah diduduki oleh Belanda (Nasution, 1984)."],n:"Kesimpulan: TNI beralih dari pertahanan terbuka ke gerilya karena strategi ini lebih efektif dalam kondisi keterbatasan persenjataan dan logistik, serta memungkinkan perlawanan tetap berjalan. Sumber: Simatupang (1980); Nasution (1984) \u2022 Terkait soal: 16."},
  {h:"Strategi Wingate Action",d:"Wingate Action adalah operasi penyusupan ke wilayah pendudukan Belanda yang diatur dalam Instruksi Nomor 1/MBKD/48.",b:["Salah satu strategi TNI dalam perang gerilya adalah Wingate Action, yaitu operasi penyusupan pasukan ke wilayah yang telah berada di bawah pendudukan Belanda. Strategi ini secara resmi diatur dalam Instruksi Markas Besar Komando Djawa Nomor 1/MBKD/48 yang memerintahkan satuan-satuan TNI untuk kembali memasuki daerah asalnya melalui jalur-jalur yang sulit dijangkau musuh.", "Tujuan utama strategi ini bukan untuk mempertahankan suatu wilayah secara permanen, melainkan membangun kembali jaringan pertahanan rakyat dan menjaga keberadaan Republik secara de facto, serta mengganggu stabilitas pertahanan dan logistik Belanda dari dalam wilayah pendudukannya.", "Keberhasilan Wingate Action sangat bergantung pada kemampuan pasukan untuk bergerak secara mandiri, menjaga kerahasiaan operasi, serta mendapat dukungan masyarakat setempat selama misi berlangsung."],n:"Kesimpulan: Wingate Action adalah operasi penyusupan ke wilayah pendudukan; tujuannya bukan menguasai wilayah secara permanen, dan keberhasilannya bergantung pada gerak mandiri, kerahasiaan, serta dukungan masyarakat. Sumber: Nasution (1984); Nasution (1979) \u2022 Terkait soal: 12, 17, 18."},
  {h:"Tugas Kompi Gagak Lodra di Malang Tenggara",d:"Kompi Gagak Lodra menjalankan Wingate Action di Wajak, Tumpang, dan Poncokusumo dengan gerak kelompok kecil dan dukungan masyarakat.",b:["Sebagai bagian dari Brigade IV, Kompi Gagak Lodra memperoleh tugas melaksanakan operasi Wingate Action di wilayah Malang Tenggara, khususnya Wajak, Tumpang, dan Poncokusumo. Kawasan tersebut dipilih karena memiliki posisi strategis yang menghubungkan wilayah Malang dengan Pasuruan dan Probolinggo, serta didominasi pegunungan, lembah, dan hutan yang mendukung pelaksanaan perang gerilya.", "Dalam operasi ini, Kompi Gagak Lodra bertugas mengonsolidasikan kembali kekuatan gerilya di daerah pendudukan Belanda, membangun hubungan dengan masyarakat, mengganggu jalur logistik musuh, serta membuka jalur infiltrasi bagi satuan-satuan lain yang akan masuk ke daerah Pasuruan dan Probolinggo, yaitu Batalyon Sjamsul Islam dan Batalyon Abdul Sjarif, yang kemudian bergerilya di timur daerah Tumpang.", "Kompi ini menerapkan prinsip-prinsip perang gerilya. Pasukan bergerak dalam kelompok-kelompok kecil dengan memanfaatkan jalur hutan, perkebunan, lembah, dan jalan setapak untuk menghindari pengawasan patroli Belanda. Sebagian besar kebutuhan logistik dipenuhi melalui dukungan masyarakat setempat yang secara sukarela menyediakan makanan, tempat persembunyian, serta informasi mengenai pergerakan musuh. Hubungan yang erat antara pasukan gerilya dan masyarakat menjadi salah satu faktor penting yang memungkinkan operasi gerilya tetap berlangsung meskipun Belanda memiliki persenjataan dan jumlah pasukan yang lebih unggul."],n:"Kesimpulan: Kompi Gagak Lodra menjalankan Wingate Action di Wajak, Tumpang, dan Poncokusumo dengan gerak kelompok kecil dan dukungan masyarakat. Sumber: Hadi & Sutopo (1997); Sutopo (1981); Nasution (1984); Wicaksono (2012) \u2022 Terkait soal: 14, 15."}
],
/* Level 3 — Jejak Gagak Lodra (Arsip 08-14) */
[
  {h:"Operasi Militer di Wajak",d:"Pasukan menguasai Garotan dan Bambangan sebagai basis awal, lalu menarik diri ke Hutan Wonosari untuk menyelamatkan kekuatan utama.",b:["Operasi gerilya Kompi Gagak Lodra dimulai bersamaan dengan pecahnya Agresi Militer Belanda II pada 19 Desember 1948. Pasukan yang dipimpin Kapten Sabar Sutopo memasuki wilayah Kecamatan Wajak dan berhasil menguasai Desa Garotan serta Desa Bambangan sebagai basis pertahanan awal. Seksi Soeseno ditempatkan di Desa Garotan dan bertugas menghambat pergerakan pasukan Belanda dari arah selatan. Penempatan personel pada beberapa titik tersebut menunjukkan bahwa Kompi Gagak Lodra telah menerapkan sistem pertahanan berlapis sebagai antisipasi terhadap kemungkinan serangan mendadak dari pihak Belanda.", "Situasi di Kecamatan Wajak tidak bertahan lama. Belanda mengerahkan kekuatan yang lebih besar dengan menerapkan strategi blitzkrieg atau perang kilat sehingga posisi pertahanan Republik semakin terdesak. Menyadari ketidakseimbangan kekuatan tersebut, Kapten Sabar Sutopo memutuskan menarik seluruh pasukannya menuju kawasan Hutan Wonosari di Poncokusumo. Keputusan itu bukan merupakan bentuk kemunduran, melainkan bagian dari strategi perang gerilya untuk menyelamatkan kekuatan utama sehingga operasi dapat dilanjutkan pada wilayah lain yang lebih menguntungkan."],n:"Kesimpulan: Penarikan pasukan dari Wajak ke Hutan Wonosari merupakan bagian dari strategi gerilya untuk menyelamatkan kekuatan utama. Sumber: Sutopo (1981); Pusat Sejarah dan Tradisi TNI (2000); Hadi & Sutopo (1997) \u2022 Terkait soal: 19, 23."},
  {h:"Pertempuran Pandansari",d:"Garda depan Seksi Sarim berhadapan dengan patroli Belanda dari Pos Poncokusumo; kompi berhasil memukul mundur musuh.",b:["Setelah keluar dari wilayah Wajak, Kompi Gagak Lodra bergerak menuju Desa Jajang sebagai tempat konsolidasi sementara. Pada malam hari, pasukan beristirahat sekaligus menyusun kembali rencana operasi berikutnya. Keesokan harinya, 20 Desember 1948, sekitar pukul 07.00 WIB, pasukan kembali bergerak menuju Desa Pandansari melalui jalur yang relatif aman dari pengawasan Belanda. Pergerakan dilakukan secara hati-hati karena wilayah Poncokusumo telah menjadi salah satu daerah patroli tentara Belanda.", "Dalam perjalanan menuju Pandansari, pasukan garda depan yang dipimpin Seksi Sarim berhadapan langsung dengan patroli Belanda yang bergerak dari Pos Poncokusumo. Kontak senjata berkembang menjadi pertempuran singkat di sekitar jalur pergerakan pasukan. Berkat penguasaan medan serta koordinasi yang baik antarseksi, Kompi Gagak Lodra berhasil memukul mundur pasukan Belanda sehingga perjalanan dapat dilanjutkan."],n:"Kesimpulan: Mobilitas tinggi dan pemanfaatan kondisi geografis menjadi faktor penting keberhasilan operasi gerilya Kompi Gagak Lodra. Sumber: Hadi & Sutopo (1997); Sutopo (1981) \u2022 Terkait soal: 20."},
  {h:"Gubugklakah, Pos Tosari, dan Serangan Balasan Belanda",d:"Beras gudang desa dibagikan kepada rakyat, Pos Tosari berhasil dihancurkan, namun serangan balasan Belanda menyusul karena posisi terdeteksi.",b:["Setelah meninggalkan Pandansari, Kompi Gagak Lodra menuju Desa Gubugklakah pada malam hari untuk menghindari pengamatan musuh. Pada pagi hari 21 Desember 1948, pasukan menemukan persediaan beras milik Belanda yang tersimpan di gudang desa. Persediaan tersebut dibagikan kepada masyarakat sekitar sebagai bantuan logistik sekaligus upaya memperkuat hubungan antara pasukan gerilya dengan penduduk setempat.", "Pada hari yang sama, Kompi Gagak Lodra melancarkan serangan mendadak terhadap pos pengawasan Belanda di Dukuh Tosari, Gubugklakah. Serangan tersebut berhasil menghancurkan pos pertahanan musuh dan membuat pasukan Belanda kehilangan sejumlah perlengkapan militer, termasuk senjata api yang kemudian dimanfaatkan oleh pasukan Republik.", "Belanda merespons melalui operasi balasan pada 22 Desember 1948 sekitar pukul 05.00 WIB. Dua kompi tentara Belanda yang didukung kendaraan lapis baja dan pesawat udara menyerang posisi Kompi Gagak Lodra ketika pasukan sedang beristirahat di gudang beras. Serangan tersebut menyebabkan sejumlah prajurit menderita luka berat dan mengakibatkan hilangnya senjata mesin kaliber 7,7 mm. Meskipun gerilya memberikan keuntungan taktis, pasukan Republik tetap menghadapi risiko besar ketika posisi persembunyian berhasil diketahui pihak Belanda."],n:"Kesimpulan: Serangan mendadak berhasil menghancurkan Pos Tosari, tetapi posisi istirahat pasukan yang diketahui Belanda memicu serangan balasan. Sumber: Sutopo (1981); Hadi & Sutopo (1997) \u2022 Terkait soal: 21, 27."},
  {h:"Menuju Hutan Kali Jahe dan Dukungan Masyarakat Begawan",d:"Jalur Jabung terputus, pasukan menuju Hutan Kali Jahe; warga Dusun Begawan memberikan bantuan singkong dan ubi.",b:["Setelah menghadapi serangan balasan Belanda, Kapten Sabar Sutopo memerintahkan seluruh pasukan mundur ke arah timur melalui kawasan hutan menuju Kecamatan Jabung. Karena jalur menuju Jabung telah dikuasai pasukan Belanda, Kompi Gagak Lodra terpaksa mengubah arah menuju kawasan Hutan Kali Jahe. Lokasi ini dipilih sebagai tempat berlindung sekaligus konsolidasi karena berupa lembah yang tertutup pepohonan lebat dan relatif sulit dijangkau kendaraan militer.", "Di tengah keterbatasan logistik, beberapa prajurit diutus menuju Dusun Begawan untuk mencari bahan makanan. Masyarakat setempat menyambut para gerilyawan dengan memberikan singkong, ubi, serta bantuan logistik lainnya yang dipusatkan di kediaman Bapak Dasiyah. Peristiwa ini menunjukkan bahwa dukungan masyarakat merupakan salah satu faktor penting yang memungkinkan operasi gerilya tetap berlangsung di tengah tekanan militer Belanda, dan bahwa perjuangan mempertahankan kemerdekaan juga melibatkan partisipasi aktif warga sipil."],n:"Kesimpulan: Dukungan masyarakat Dusun Begawan menjadi bukti bahwa perjuangan kemerdekaan tidak hanya dilakukan oleh tentara. Sumber: Sutopo (1981); Hadi & Sutopo (1997); Tarso (2017) \u2022 Terkait soal: 24."},
  {h:"Pertempuran Lembah Kali Jahe",d:"Informasi mata-mata membuat Belanda menguasai perbukitan Pusung Manggis dan menyerang dari ketinggian saat hujan dan kabut.",b:["Pada pukul 12.00, pasukan Kompi Gagak Lodra mulai memasuki Hutan Kali Jahe. Keberadaan mereka diketahui Belanda setelah memperoleh informasi dari salah satu mata-mata di Desa Taji yang berjalan dari arah pasar dan melewati pasukan yang sedang beristirahat di bawah pohon besar. Informasi itu dimanfaatkan Belanda untuk menduduki kawasan perbukitan Pusung Manggis yang mengelilingi lembah sehingga pasukan Republik berada dalam posisi kurang menguntungkan.", "Sekitar pukul 14.00 WIB, tentara Belanda menyerang secara tiba-tiba menggunakan senapan otomatis dan granat dari posisi yang lebih tinggi, saat hujan turun disertai kabut. Hujan lebat dan kabut tebal membuat jarak pandang sangat terbatas. Berdasarkan kesaksian Sunari HS, medan yang licin serta terputusnya komunikasi antarseksi menyebabkan koordinasi pasukan terganggu. Meskipun demikian, para prajurit tetap melawan hingga titik penghabisan.", "Pertempuran ini mengakibatkan sekitar 37 hingga 40 prajurit gugur, termasuk Kadet Subandi dan Kadet Sumarto, sedangkan Kapten Sabar Sutopo berhasil menyelamatkan diri setelah berlindung di semak-semak dan mengikuti aliran sungai menuju tempat yang aman.", "Secara taktis, pertempuran ini mengakibatkan kerugian besar bagi Kompi Gagak Lodra. Namun secara strategis, pengorbanan tersebut berhasil mengalihkan perhatian pasukan Belanda sehingga operasi penyusupan Batalyon Abdul Sjarif dan Batalyon Sjamsul Islam menuju wilayah Pasuruan dan Probolinggo dapat berlangsung lebih aman."],n:"Kesimpulan: Pertempuran Lembah Kali Jahe menimbulkan kerugian taktis yang besar, tetapi memberi dampak strategis bagi operasi batalyon lain. Sumber: Sutopo (1981); Artawi (2017); Hadi & Sutopo (1997); Moehkardi (1979) \u2022 Terkait soal: 25, 27, 28."},
  {h:"Konsolidasi di Garotan dan Gencatan Senjata",d:"Pasukan tambahan Letnan Sumodihardjo datang dengan senjata berat; taktik tabrak lari dilancarkan hingga gencatan senjata Agustus 1949.",b:["Beberapa bulan setelah Pertempuran Lembah Kali Jahe, Kompi Gagak Lodra kembali melakukan konsolidasi di Desa Garotan untuk membangun kembali kekuatan pasukan dan melanjutkan perjuangan di wilayah Keresidenan Malang, dengan datangnya pasukan tambahan di bawah pimpinan Letnan Sumodihardjo yang bersenjata berat, terdiri dari Mortier 8 dan 12,7.", "Memasuki pertengahan tahun 1949, kekuatan Kompi Gagak Lodra yang telah disusun kembali di Desa Garotan mulai melancarkan taktik tabrak lari (hit-and-run) untuk mempersempit ruang gerak patroli Belanda di poros Wajak\u2013Turen. Semangat tempur pasukan kembali pulih seiring menguatnya pasokan logistik rahasia dari jaringan bawah tanah masyarakat Malang Tenggara.", "Keberadaan kompi ini tetap menjadi ancaman konkret bagi keamanan sektor perkebunan yang dikuasai Belanda di wilayah tersebut, hingga dikeluarkannya perintah gencatan senjata (ceasefire) secara resmi pada Agustus 1949 menyusul kesepakatan Roem-Royen."],n:"Kesimpulan: Setelah Kali Jahe, Kompi Gagak Lodra membangun kembali kekuatan di Garotan dan melanjutkan taktik tabrak lari hingga gencatan senjata Agustus 1949. Sumber: Sutopo (1981); Hadi & Sutopo (1997); Nasution (1978) \u2022 Terkait soal: 26, 29."},
  {h:"Penyerahan Wilayah dan Kedaulatan di Turen",d:"Pasca KMB, Turen menjadi pusat alih kekuasaan taktis dari KL/KNIL kepada APRIS di Malang Tenggara.",b:["Pasca Konferensi Meja Bundar (KMB) akhir tahun 1949, salah satu agenda krusial di tingkat lokal adalah penyerahan pangkalan militer dan wilayah administrasi dari tentara Belanda (KL/KNIL) kepada Angkatan Perang Republik Indonesia Serikat (APRIS). Untuk wilayah Malang Tenggara, Turen dipilih sebagai pusat pelaksanaan alih kekuasaan taktis ini karena posisinya yang strategis sebagai kota kecamatan dan pusat ekonomi perkebunan.", "Proses penyerahan di Turen berlangsung resmi namun tegang. Kapten Sabar Sutopo memimpin langsung delegasi Kompi Gagak Lodra turun dari basis gerilya, disambut sorak-sorai masyarakat Turen yang memadati area sekitar gedung pertemuan setempat. Dalam upacara serah terima, komandan pos militer Belanda menyerahkan dokumen pemetaan wilayah, kunci fasilitas vital, serta pos-pos penjagaan secara resmi kepada Kapten Sabar Sutopo sebagai perwakilan militer Republik.", "Penyerahan wilayah di Turen menandai berakhirnya era konfrontasi bersenjata di Malang Tenggara sekaligus mengukuhkan keberhasilan perjuangan gerilya Kompi Gagak Lodra dalam mempertahankan kedaulatan Indonesia hingga penyerahan kedaulatan penuh secara nasional pada 27 Desember 1949. Kemudian, Batalyon I Hamid Rusdi menjelma menjadi Batalyon 30 dan diresmikan menjadi Batalyon Infanteri 512, serta Kompi II Gagak Lodra ditetapkan sebagai Kompi Bantuan Batalyon Infanteri 512 Resimen 18 Divisi Brawijaya yang sampai sekarang masih berkedudukan di Malang."],n:"Kesimpulan: Penyerahan wilayah di Turen mengakhiri konfrontasi bersenjata di Malang Tenggara dan mengukuhkan keberhasilan perjuangan gerilya Kompi Gagak Lodra. Sumber: Wahyu & Wicaksono (2017); Hadi & Sutopo (1997); Aprilzal (2023); Sutopo (1981) \u2022 Terkait soal: 22, 30."}

function musicInit(){
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return false;
  if(!MUS.ctx){
    MUS.ctx=new Ctx();

    MUS.master=MUS.ctx.createGain();MUS.master.gain.value=.5;
    sfxGain=MUS.ctx.createGain();sfxGain.gain.value=.9;
    try{const comp=MUS.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;MUS.master.connect(comp);sfxGain.connect(comp);comp.connect(MUS.ctx.destination)}catch(e){MUS.master.connect(MUS.ctx.destination);sfxGain.connect(MUS.ctx.destination)}
    const n=Math.floor(MUS.ctx.sampleRate*.5),b=MUS.ctx.createBuffer(1,n,MUS.ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    MUS.noise=b;
  }
  if(MUS.ctx.state==='suspended')MUS.ctx.resume().catch(()=>{});
  return true;
}

  gn.gain.setValueAtTime(vol,t+Math.max(.021,dur*.6));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(bus||MUS.master);o.start(t);o.stop(t+dur+.06);
}
function mKick(t,bus){

  gn.gain.setValueAtTime(.42,t);gn.gain.exponentialRampToValueAtTime(.001,t+.15);

  for(let sx=0;sx<=W;sx+=14){const wx=sx+cam*par,yy=base-amp*(.6+.4*Math.sin(wx*.0042+seed))*(.72+.28*Math.sin(wx*.0015+seed*2.3));g.lineTo(sx,yy)}
  g.lineTo(W,GROUND+30);g.closePath();g.fill();
}
function canopyLayer(par,y0,span,col,sc,off){
  g.fillStyle=col;const step=120*sc;
  for(let i=-1;i<Math.ceil(W/step)+2;i++){
    const cx2=i*step-((cam*par+off)%step)+(i*37%17),r=(30+((i*53)%25))*sc,cy=y0+((i*97)%span);
    g.beginPath();g.arc(cx2,cy,r*1.3,0,7);g.arc(cx2+r*1.05,cy+r*.4,r,0,7);g.arc(cx2-r*1.05,cy+r*.45,r*.92,0,7);g.fill();
  }
}
function jungleTree(x,gy,sc){
  g.fillStyle='#3f301e';g.fillRect(x-4*sc,gy-72*sc,8*sc,72*sc);
  g.beginPath();g.moveTo(x-11*sc,gy);g.lineTo(x-4*sc,gy-26*sc);g.lineTo(x-1*sc,gy);g.closePath();g.fill();
  g.beginPath();g.moveTo(x+11*sc,gy);g.lineTo(x+4*sc,gy-24*sc);g.lineTo(x+1*sc,gy);g.closePath();g.fill();
  g.fillStyle='#1f5530';g.beginPath();g.arc(x,gy-88*sc,30*sc,0,7);g.arc(x-25*sc,gy-70*sc,20*sc,0,7);g.arc(x+25*sc,gy-72*sc,22*sc,0,7);g.arc(x+9*sc,gy-102*sc,17*sc,0,7);g.fill();
  g.fillStyle='#2b6a3e';g.beginPath();g.arc(x-7*sc,gy-93*sc,14*sc,0,7);g.arc(x+15*sc,gy-85*sc,11*sc,0,7);g.fill();
}
function rumahDesa(x,gy,sc){
  const w2=40*sc,h2=20*sc;
  g.fillStyle='#e9ddc2';g.fillRect(x,gy-h2,w2,h2);
  g.fillStyle='#c9b894';g.fillRect(x,gy-4*sc,w2,4*sc);
  g.fillStyle='#7a4e26';g.fillRect(x+w2*.38,gy-h2*.72,w2*.24,h2*.72);
  g.fillStyle='#a8402c';g.beginPath();g.moveTo(x-6*sc,gy-h2);g.lineTo(x+w2/2,gy-h2-15*sc);g.lineTo(x+w2+6*sc,gy-h2);g.closePath();g.fill();
  g.fillStyle='#c45a3e';g.beginPath();g.moveTo(x+3*sc,gy-h2);g.lineTo(x+w2/2,gy-h2-11*sc);g.lineTo(x+w2-3*sc,gy-h2);g.closePath();g.fill();
  g.fillStyle='#ffdf9e';g.fillRect(x+6*sc,gy-h2+5*sc,7*sc,6*sc);
  g.fillStyle='#6e4520';g.fillRect(x+6*sc,gy-h2+5*sc,7*sc,1.4);
}

    if(!night){g.fillStyle='#ffe9a0';g.beginPath();g.arc(sx0,sy0,30,0,7);g.fill()}

/* efek cuaca lapis depan: hujan deras + kabut menggulung (khusus level bukit) */
function drawHujanKabut(){
  g.strokeStyle='rgba(210,226,242,.34)';g.lineWidth=1.2;g.beginPath();
  for(let i=0;i<62;i++){
    const sp=5+(i%4)*1.7,rx=(((i*167)%W)+W)%W+Math.sin(tick/38+i*1.7)*7,ry=((i*89+tick*sp)%(H+50))-25;
    g.moveTo(rx,ry);g.lineTo(rx-3,ry+13.5);
  }

function rekapSementara(){
  const done=LV.filter((_,i)=>lvRes[i]&&lvRes[i].done).length;
  let out='Level selesai: '+done+'/'+LV.length+'\n';
  for(let i=0;i<LV.length;i++)if(lvRes[i]&&lvRes[i].done)out+='Nilai L'+(i+1)+': '+lvNilai(i)+'\n';
  const ur=[];let s=-1;
  for(let i=0;i<LV.length;i++){const dn=lvRes[i]&&lvRes[i].done;if(!dn&&s<0)s=i;if(dn&&s>=0){ur.push([s,i-1]);s=-1}}

}

function fitLines(s,mw,maxN){
  const words=s.split(' '),out=[];let l='',trunc=false;
  for(let i=0;i<words.length;i++){const t=l?l+' '+words[i]:words[i];
    if(g.measureText(t).width>mw&&l){out.push(l);l=words[i];if(out.length===maxN){trunc=true;break}}else l=t}
  if(!trunc&&l)out.push(l);
  if(trunc){let last=l;while(last&&g.measureText(last+'\u2026').width>mw)last=last.slice(0,-1).replace(/\s+$/,'');out[maxN-1]=last+'\u2026'}
  return out}

function wrapW(words,mw){const out=[];let l='';for(const w of words){const t=l?l+' '+w:w;if(g.measureText(t).width>mw&&l){out.push(l);l=w}else l=t}if(l)out.push(l);return out}
function quizLayoutAll(){
  /* Skala adaptif: pakai huruf terbesar yang membuat pertanyaan tak terpotong
     DAN keempat opsi tetap muat di dalam panel (batas bawah y<=392).
     Perbaikan: soal HOTS Level 3 dulu meluber hingga opsi D keluar panel & sulit ditekan.
     Kini ada skala terkecil ke-4 + penjepit tinggi baris sehingga opsi D SELALU berada
     di dalam panel dan area kliknya penuh. */
  const SC=[
    {fs:15,ofs:12,qw:584,ow:468,qh:19,lh:15,gap:6,qmax:5},
    {fs:14,ofs:11.5,qw:600,ow:486,qh:17,lh:14,gap:5,qmax:4},
    {fs:13,ofs:10.5,qw:612,ow:500,qh:16,lh:13,gap:4,qmax:4},
    {fs:12,ofs:10,qw:624,ow:516,qh:15,lh:12,gap:3.5,qmax:4}
  ];
  let out=null;
  for(let si=0;si<SC.length;si++){
    const{fs,ofs,qw,ow,qh,lh,gap,qmax}=SC[si];
    g.font=fs+'px '+F1;
    const ql=fitLines(currentQuiz.question,qw,qmax);
    const uncut=wrapW(currentQuiz.question.split(' '),qw).length<=qmax;
    const qy0=ql.length>2?100:108;
    const qBot=qy0+qh*ql.length+6;let oy=qBot;const rows=[];
    const last=si===SC.length-1;
    /* pada skala terkecil, tinggi tiap baris opsi dijepit agar opsi D tetap di dalam panel */
    const hMax=last?Math.max(30,Math.floor((392-qBot-3*gap)/4)):1e9;
    for(let i=0;i<4;i++){
      g.font=ofs+'px '+F1;
      const maxL=Math.max(2,Math.min(4,Math.floor((hMax-12)/lh)));
      const ls=wrapW(currentQuiz.options[i].split(' '),ow).slice(0,maxL);
      if(ls.length===maxL){let t2=ls[maxL-1];while(t2&&g.measureText(t2+'\u2026').width>ow)t2=t2.slice(0,-1).replace(/\s+$/,'');ls[maxL-1]=t2+'\u2026'}
      let h=ls.length>1?lh*ls.length+12:32;
      if(h>hMax)h=hMax;
      rows.push({oy,ls,h,ofs,lh});oy+=h+gap;
    }
    out={fs,ql,qy0,qh,rows};
    if(uncut&&oy-gap<=392)break;
  }
  return out;
}
